<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ghost</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0c0c0c;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 16px 24px;
      border-bottom: 1px solid #1e1e1e;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    header h1 { font-size: 18px; font-weight: 600; letter-spacing: 0.05em; }
    #dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #2a2a2a;
      transition: background 0.3s;
    }
    #dot.connected { background: #3a9e5f; }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-behavior: smooth;
    }

    .msg {
      max-width: 72%;
      padding: 11px 15px;
      border-radius: 14px;
      font-size: 15px;
      line-height: 1.55;
      word-break: break-word;
    }
    .msg.user {
      align-self: flex-end;
      background: #1b3a5c;
      color: #cce0ff;
      border-bottom-right-radius: 4px;
    }
    .msg.ghost {
      align-self: flex-start;
      background: #1a1a1a;
      border: 1px solid #282828;
      border-bottom-left-radius: 4px;
    }
    .msg.ghost.streaming::after {
      content: '▌';
      opacity: 0.6;
      animation: blink 0.9s step-end infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }

    #controls {
      padding: 20px 24px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      border-top: 1px solid #1a1a1a;
    }

    #btn {
      width: 72px; height: 72px;
      border-radius: 50%;
      border: none;
      background: #1b3a5c;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, transform 0.1s, box-shadow 0.15s;
      outline: none;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    #btn:hover:not(:disabled) { background: #234d7a; }
    #btn.recording {
      background: #6b1414;
      transform: scale(1.06);
      box-shadow: 0 0 0 8px rgba(180, 30, 30, 0.2);
      animation: pulse 1.4s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 8px rgba(180, 30, 30, 0.2); }
      50%       { box-shadow: 0 0 0 16px rgba(180, 30, 30, 0.05); }
    }
    #btn:disabled { opacity: 0.35; cursor: not-allowed; }

    #hint {
      font-size: 12px;
      color: #444;
      letter-spacing: 0.03em;
    }
    #status {
      font-size: 13px;
      color: #555;
      min-height: 18px;
    }
    #status.active { color: #888; }
  </style>
</head>
<body>

<header>
  <div id="dot"></div>
  <h1>Ghost</h1>
</header>

<div id="messages"></div>

<div id="controls">
  <button id="btn" title="Hold to speak">
    <svg id="icon-mic" width="26" height="26" viewBox="0 0 24 24" fill="none"
         stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
      <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
      <line x1="12" y1="19" x2="12" y2="23"/>
      <line x1="8"  y1="23" x2="16" y2="23"/>
    </svg>
  </button>
  <div id="hint">Hold to speak, release to send</div>
  <div id="status"></div>
</div>

<script>
  const btn    = document.getElementById('btn');
  const status = document.getElementById('status');
  const msgs   = document.getElementById('messages');
  const dot    = document.getElementById('dot');

  let ws           = null;
  let recording    = false;
  let audioCtx     = null;
  let streamSource = null;
  let processor    = null;
  let micStream    = null;
  let pcmChunks    = [];
  let ghostMsgEl   = null;
  let audioQueue   = [];
  let audioPlaying = false;
  let playCtx      = new AudioContext();

  // ── WebSocket ──────────────────────────────────────────────────────────────

  function connect() {
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    ws = new WebSocket(`${proto}//${location.host}/ws`);
    ws.onopen  = () => { dot.className = 'connected'; setStatus(''); };
    ws.onclose = () => { dot.className = ''; setStatus('Reconnecting…', true); setTimeout(connect, 2000); };
    ws.onerror = () => setStatus('Connection error', true);
    ws.onmessage = onMessage;
  }

  function onMessage(event) {
    const msg = JSON.parse(event.data);

    if (msg.type === 'transcript') {
      addMsg('user', msg.text);
      ghostMsgEl = addMsg('ghost', '');
      ghostMsgEl.classList.add('streaming');
      setStatus('Thinking…', true);

    } else if (msg.type === 'sentence') {
      const sep = ghostMsgEl.textContent ? ' ' : '';
      ghostMsgEl.textContent += sep + msg.text;
      msgs.scrollTop = msgs.scrollHeight;
      enqueueAudio(msg.audio);
      setStatus('Speaking…', true);

    } else if (msg.type === 'done') {
      if (ghostMsgEl) ghostMsgEl.classList.remove('streaming');
      ghostMsgEl = null;
      btn.disabled = false;
      setStatus('');

    } else if (msg.type === 'error') {
      if (ghostMsgEl) { ghostMsgEl.classList.remove('streaming'); ghostMsgEl = null; }
      addMsg('ghost', `⚠ ${msg.message}`);
      btn.disabled = false;
      setStatus('');
    }
  }

  // ── Audio capture (Web Audio API → 16 kHz PCM → WAV) ─────────────────────

  async function startRecording() {
    try {
      micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch {
      setStatus('Microphone access denied', true);
      return false;
    }
    pcmChunks = [];
    // Request 16 kHz — browser resamples if hardware differs
    audioCtx = new AudioContext({ sampleRate: 16000 });
    streamSource = audioCtx.createMediaStreamSource(micStream);
    // ScriptProcessor: deprecated but works everywhere without a separate worklet file
    processor = audioCtx.createScriptProcessor(4096, 1, 1);
    processor.onaudioprocess = e => {
      pcmChunks.push(new Float32Array(e.inputBuffer.getChannelData(0)));
    };
    streamSource.connect(processor);
    processor.connect(audioCtx.destination);
    return true;
  }

  function stopAndSend() {
    if (!recording) return;
    recording = false;
    btn.classList.remove('recording');
    btn.disabled = true;
    setStatus('Processing…', true);

    processor.disconnect();
    streamSource.disconnect();
    micStream.getTracks().forEach(t => t.stop());
    audioCtx.close();

    // Flatten PCM chunks
    const total = pcmChunks.reduce((s, c) => s + c.length, 0);
    const pcm = new Float32Array(total);
    let off = 0;
    for (const c of pcmChunks) { pcm.set(c, off); off += c.length; }

    const wav = encodeWAV(pcm, 16000);
    const b64 = arrayBufferToBase64(wav);
    ws.send(JSON.stringify({ type: 'audio', data: b64 }));
  }

  function encodeWAV(samples, sr) {
    const buf  = new ArrayBuffer(44 + samples.length * 2);
    const view = new DataView(buf);
    const wr   = (o, s) => { for (let i = 0; i < s.length; i++) view.setUint8(o + i, s.charCodeAt(i)); };
    wr(0, 'RIFF');
    view.setUint32(4,  36 + samples.length * 2, true);
    wr(8, 'WAVE');  wr(12, 'fmt ');
    view.setUint32(16, 16, true);
    view.setUint16(20, 1,  true);   // PCM
    view.setUint16(22, 1,  true);   // mono
    view.setUint32(24, sr, true);
    view.setUint32(28, sr * 2, true);
    view.setUint16(32, 2,  true);
    view.setUint16(34, 16, true);   // 16-bit
    wr(36, 'data');
    view.setUint32(40, samples.length * 2, true);
    let o = 44;
    for (let i = 0; i < samples.length; i++) {
      const s = Math.max(-1, Math.min(1, samples[i]));
      view.setInt16(o, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
      o += 2;
    }
    return buf;
  }

  function arrayBufferToBase64(buf) {
    const bytes = new Uint8Array(buf);
    let out = '';
    const chunk = 8192;
    for (let i = 0; i < bytes.length; i += chunk)
      out += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
    return btoa(out);
  }

  // ── Hold-to-speak ──────────────────────────────────────────────────────────

  async function onPressStart(e) {
    e.preventDefault();
    if (btn.disabled || recording) return;
    const ok = await startRecording();
    if (!ok) return;
    recording = true;
    btn.classList.add('recording');
    setStatus('Listening…', true);
  }

  function onPressEnd(e) {
    e.preventDefault();
    stopAndSend();
  }

  btn.addEventListener('mousedown',  onPressStart);
  btn.addEventListener('touchstart', onPressStart, { passive: false });
  btn.addEventListener('mouseup',    onPressEnd);
  btn.addEventListener('mouseleave', onPressEnd);
  btn.addEventListener('touchend',   onPressEnd);

  // ── Audio playback ─────────────────────────────────────────────────────────

  function b64ToArrayBuffer(b64) {
    const bin = atob(b64);
    const buf = new ArrayBuffer(bin.length);
    const u8  = new Uint8Array(buf);
    for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
    return buf;
  }

  function enqueueAudio(b64wav) {
    audioQueue.push(b64wav);
    if (!audioPlaying) playNext();
  }

  async function playNext() {
    if (!audioQueue.length) { audioPlaying = false; return; }
    audioPlaying = true;
    const b64 = audioQueue.shift();
    try {
      if (playCtx.state === 'suspended') await playCtx.resume();
      const buffer = await playCtx.decodeAudioData(b64ToArrayBuffer(b64));
      const src = playCtx.createBufferSource();
      src.buffer = buffer;
      src.connect(playCtx.destination);
      src.onended = playNext;
      src.start();
    } catch (e) {
      console.error('Playback error:', e);
      playNext();
    }
  }

  // ── Helpers ────────────────────────────────────────────────────────────────

  function addMsg(role, text) {
    const div = document.createElement('div');
    div.className = `msg ${role}`;
    div.textContent = text;
    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
    return div;
  }

  function setStatus(text, active = false) {
    status.textContent = text;
    status.className   = active ? 'active' : '';
  }

  connect();
</script>
</body>
</html>
